name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: DATABASE_URL='postgresql://postgres:postgres@localhost:5432/base_boilerplate?schema=public' npx prisma generate
      - run: DATABASE_URL='postgresql://postgres:postgres@localhost:5432/base_boilerplate?schema=public' npx prisma validate
      # TODO: re-enable strict lint gate after template-wide lint debt cleanup
      - run: DATABASE_URL='postgresql://postgres:postgres@localhost:5432/base_boilerplate?schema=public' npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cd .. && node ./scripts/check-permissions-consistency.mjs
